  <body>
    
<div class="abertura" id="abertura" role="status" aria-live="polite" aria-label="Carregando santuário">
<div class="quadro">
<img class="quadro__img" src="/splash/santuario.webp" width="828" height="1472" alt="" decoding="async" fetchpriority="high" onload="this.dataset.ok=1" />
<div class="neblina neblina--a"></div>
<div class="neblina neblina--b"></div>
<div class="selo-chao"></div>
<i class="chama" style="left:42.76%;top:44.25%;--i:0"></i>
<i class="chama" style="left:44.36%;top:43.10%;--i:1"></i>
<i class="chama" style="left:45.78%;top:44.30%;--i:2"></i>
<i class="chama" style="left:64.80%;top:43.25%;--i:3"></i>
<i class="chama" style="left:66.31%;top:44.30%;--i:4"></i>
<i class="chama" style="left:63.73%;top:44.80%;--i:5"></i>
<i class="chama" style="left:36.27%;top:51.50%;--i:6"></i>
<i class="chama" style="left:35.29%;top:52.90%;--i:7"></i>

<i class="chama" style="left:32.36%;top:54.40%;--i:9"></i>

<i class="chama" style="left:77.16%;top:72.50%;--i:15"></i>
<div class="veu"></div>
</div>
<div class="abertura__rodape">
<p class="abertura__pct" id="ab-pct">0%</p>
<div class="barra"><span class="barra__fio"></span><span class="barra__gema"></span></div>
<p class="abertura__estado">Carregando santuário…</p>
</div>
</div>
    <div id="root"></div>
<script>
(function(){
  var el=document.getElementById('abertura'),root=document.getElementById('root');if(!el)return;
  var pct=document.getElementById('ab-pct'),chamas=el.querySelectorAll('.chama'),selo=el.querySelector('.selo-chao');
  var v=0,alvo=6,fim=false,saiu=false;
  window.__abertura=function(p){if(p>alvo)alvo=p>100?100:p;};
  function sair(){if(saiu)return;saiu=true;el.setAttribute('data-saindo','');setTimeout(function(){clearInterval(id);if(el.parentNode)el.parentNode.removeChild(el);},700);}
  function passo(){
    if(fim){v+=(100-v)*.6+3;}
    else if(v<alvo){v+=(alvo-v)*.16+.3;}
    else if(v<Math.min(alvo+7,95)){v+=.06;}
    if(v>=100){v=100;}
    var r=Math.round(v);
    pct.textContent=r+'%';
    el.style.setProperty('--p',v.toFixed(1));
    for(var i=0;i<chamas.length;i++){if(!chamas[i].hasAttribute('data-on')&&v>=(i+1)*100/(chamas.length+1))chamas[i].setAttribute('data-on','');}
    if(v>=24)selo.setAttribute('data-on','');
    if(fim&&v>=100)sair();
  }
  var id=setInterval(passo,60);
  new MutationObserver(function(){if(root.firstChild){fim=true;alvo=100;}}).observe(root,{childList:true});
})();
</script>
    <script type="module" src="/src/main.tsx"></script>
