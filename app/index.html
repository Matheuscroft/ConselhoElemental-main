  <body>
    <div id="root">
<div class="abertura" role="status" aria-live="polite" aria-label="Carregando santuário">
<div class="quadro">
<img class="quadro__img" src="/splash/santuario.webp" width="828" height="1472" alt="" decoding="async" fetchpriority="high" onload="this.dataset.ok=1" />
<div class="neblina neblina--a"></div>
<div class="neblina neblina--b"></div>
<div class="selo-chao"></div>
<i class="chama" style="left:42.76%;top:44.25%;--i:0"></i>
<i class="chama" style="left:44.36%;top:43.10%;--i:1"></i>

</div>
<div class="abertura__rodape">
<p class="abertura__pct" id="ab-pct">0%</p>
<div class="barra"><span class="barra__fio"></span><span class="barra__gema"></span></div>
<p class="abertura__estado">Carregando santuário…</p>
</div>
</div>
<script>
(function(){var p=document.getElementById('ab-pct');if(!p)return;var t0=Date.now();var id=setInterval(function(){if(!document.getElementById('ab-pct')){clearInterval(id);return;}var t=Date.now()-t0;var v=Math.round(92*(1-Math.exp(-t/2600)));p.textContent=v+'%';},120);})();
</script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
